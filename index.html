<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Island — a small 3D world</title>
<meta name="description" content="A hand-built toy diorama in three.js: a floating island with a waterfall, drifting clouds and a tiny wanderer. Drag to look around.">
<meta property="og:title" content="Floating Island — a small 3D world">
<meta property="og:description" content="A hand-built toy diorama in three.js. Drag to look around; switch to dusk.">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/three/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "./vendor/three/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "./vendor/three/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "./vendor/three/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "./vendor/three/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "./vendor/three/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "./vendor/three/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "./vendor/three/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  :root {
    --ink: var(--color-text);
    --ink-soft: var(--color-neutral-700);
    --ground: var(--color-bg);
    --halo: var(--color-accent-200);
    --chip: color-mix(in srgb, var(--color-bg) 70%, transparent);
  }
  html[data-island-time="dusk"] {
    --ink: var(--color-bg);
    --ink-soft: var(--color-neutral-300);
    --ground: #2e2b25;
    --halo: #4a3a2a;
    --chip: color-mix(in srgb, #2e2b25 70%, transparent);
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--ink);
    background: radial-gradient(60% 55% at 58% 52%, var(--halo), var(--ground) 72%);
    transition: background 0.9s ease, color 0.6s ease;
  }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--color-accent); }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s ease; }
  three-d-stage.ready { opacity: 1; }
  .frame {
    position: fixed; inset: 0; pointer-events: none;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 4vw, 48px);
  }
  .frame > * { pointer-events: auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  /* accent-700, not accent-500: 12 px text needs 4.5:1 on the sand background (accent-500 gives 3.0:1) */
  .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 700; margin: 0 0 var(--space-2); }
  html[data-island-time="dusk"] .kicker { color: var(--color-accent-300); }
  h1 { font-size: clamp(44px, 7.5vw, 104px); line-height: 0.95; margin: 0; max-width: 7ch; text-wrap: balance; }
  .lede { max-width: 34ch; margin: var(--space-3) 0 0; font-size: 16px; color: var(--ink-soft); text-wrap: pretty; transition: color 0.6s ease; }
  .back { font-family: var(--font-heading); font-size: 15px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--chip); backdrop-filter: blur(6px); }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .toggle { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--chip); backdrop-filter: blur(6px); }
  .toggle button {
    font: inherit; font-family: var(--font-heading); font-size: 15px; color: var(--ink);
    border: 0; background: transparent; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: background 0.3s ease, color 0.3s ease;
  }
  .toggle button:hover { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
  /* accent-700 behind the light text: accent-500 gave 3.0:1 for the 15 px label (axe color-contrast) */
  /* plus a ring in the text colour: the chosen time shows by shape, not only by the fill (WCAG 1.4.1; at dusk the fill is 2.1:1 against the chip) */
  .toggle button[aria-pressed="true"] { background: var(--color-accent-700); color: var(--color-bg); box-shadow: inset 0 0 0 2px var(--ink); }
  .toggle button:active { background: var(--color-accent-800); }
  .toggle button:focus-visible, .back:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .toggle svg { width: 18px; height: 18px; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 0; text-align: right; transition: color 0.6s ease; }
  .hint kbd { font-family: inherit; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
  @media (max-width: 640px) {
    .lede { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<three-d-stage name="floating-island" background="transparent" autorotate hide-ui role="img" aria-label="A floating island with a waterfall, drifting clouds and a tiny wanderer walking from the gate to the cottage door"></three-d-stage>

<main class="frame">
  <header class="top">
    <div>
      <p class="kicker">A small world · 2026</p>
      <h1>Floating Island</h1>
      <p class="lede">A toy diorama built entirely in code. Someone lives here — watch them walk from the gate to their door.</p>
    </div>
    <a class="back" href="https://notland-design.vercel.app/work">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      Work
    </a>
  </header>
  <div></div>
  <footer class="bottom">
    <div class="toggle" role="group" aria-label="Time of day">
      <button type="button" data-time="day" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"></path></svg>
        Day
      </button>
      <button type="button" data-time="dusk" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        Dusk
      </button>
    </div>
    <p class="hint">Drag to look around · scroll to zoom · <kbd>D</kbd> for dusk</p>
  </footer>
</main>

<script>
  const stage = document.querySelector('three-d-stage');
  // Less motion when the OS asks for it: no turntable (the island itself goes still in island-model.js)
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) stage.removeAttribute('autorotate');
  const btns = document.querySelectorAll('.toggle button');
  const sync = (t) => btns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.time === t)));
  addEventListener('island:time', (e) => { sync(e.detail); stage.classList.add('ready'); });
  const set = (t) => { if (window.setIslandTime) { setIslandTime(t); try { localStorage.setItem('island-time', t); } catch (_) {} } };
  btns.forEach((b) => b.addEventListener('click', () => set(b.dataset.time)));
  addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'd' && !e.metaKey && !e.ctrlKey) set(document.documentElement.dataset.islandTime === 'dusk' ? 'day' : 'dusk');
  });
  setTimeout(() => stage.classList.add('ready'), 4000);
</script>
<script src="three-d-stage.js"></script>
<script type="module" src="island-model.js"></script>
</body>
</html>
